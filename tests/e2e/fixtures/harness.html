<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kōshi Layout Test Harness</title>
  <!-- Load the actual production Core stylesheet directly from the repository -->
  <link rel="stylesheet" href="/src/styles/koshi.css">
  <style>
    /* Minimal test harness baseline:
       - No box-sizing overrides (koshi.css defines box-sizing in @layer kos-grid)
       - No margin/padding resets on test children
       - Only reset body margin to prevent outer canvas offset discrepancies */
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      color: #1a1a1a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #stage {
      width: 100%;
      min-height: 100vh;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div id="stage"></div>
</body>
</html>
